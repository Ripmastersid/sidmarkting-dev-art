<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sid Marketing & Dev</title>
  <!-- Link direto para o Favicon que está no seu repositório -->
  <link rel="icon" type="image/png" href="favicon-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO (HEADER) -->
  <header id="main-header">
    <div class="header-container">
      <div class="logo-area">
        <img src="favicon-icon.png" alt="Icone Sid" class="header-icon">
        <span class="brand-name">sidmarkting-dev-art</span>
      </div>
      <!-- Menu Hambúrguer Visual -->
      <div class="menu-hamburger">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section id="hero">
    <div class="hero-container">
      <div class="hero-text">
        <h1>Transforme sua Presença Digital</h1>
        <p>Criamos soluções web de alto impacto para destacar o seu negócio no mercado atual.</p>
        <!-- Chamada direta de função sem depender de scripts externos complexos -->
        <button class="pulse-button" onclick="ativarFormulario()">Quero Alavancar Meu Negócio</button>
      </div>
      
      <!-- CONTAINER SEGURO PARA O NPC 3D -->
      <div id="npc-container">
        <!-- Visualizador 3D nativo e leve que lê o seu arquivo do repositório -->
        <model-viewer 
          src="adultman-sid3d-v1.glb" 
          camera-controls 
          auto-rotate 
          disable-zoom
          aria-label="NPC 3D Sid"
          style="width: 100%; height: 100%;">
        </model-viewer>
      </div>
    </div>
  </section>

  <!-- SEÇÃO DO FORMULÁRIO -->
  <section id="form-section" class="form-hidden">
    <div class="form-box">
      <h2>Insira seus dados abaixo</h2>
      <!-- O formulário funcional será estruturado aqui na próxima etapa -->
      <p style="color: #b3b3b3; text-align: center;">Área do Formulário de Negócios</p>
    </div>
  </section>

  <!-- Script minimalista apenas para a transição de descida -->
  <script>
    function toggleMenu() {
      // Porta de entrada limpa para o menu futuramente
    }

    function ativarFormulario() {
      const section = document.getElementById('form-section');
      section.classList.remove('form-hidden');
      section.classList.add('form-visible');
      section.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
  
  <!-- Script externo seguro para renderizar o .glb automaticamente -->
  <script type="module" src="https://googleapis.com"></script>
</body>
</html>
